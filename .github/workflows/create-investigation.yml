name: Create Blind Truth Investigation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "What should The Blind Truth investigate?"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: pip install google-genai

      - name: Generate Blind Truth draft with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INVESTIGATION_TOPIC: ${{ inputs.topic }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from google import genai
          from google.genai import types

          topic = os.environ["INVESTIGATION_TOPIC"].strip()

          if not topic:
              raise SystemExit("Investigation topic cannot be empty.")

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          prompt = f"""
          You are the research and drafting assistant for The Blind Truth,
          an evidence-focused investigative publication.

          INVESTIGATION TOPIC:
          {topic}

          Prepare a DRAFT investigation for human review.

          Research requirements:
          1. Use Google Search to research the subject.
          2. Prefer primary sources, official records, government documents,
             academic research, court records, institutional sources, and
             high-quality journalism.
          3. Do not present speculation as fact.
          4. Clearly separate:
             - confirmed facts
             - disputed claims
             - unsupported claims
             - unknowns
          5. Present meaningful evidence both supporting and challenging
             the central claim.
          6. Include source links.
          7. If evidence is insufficient, clearly say so.
          8. Never invent quotations, documents, statistics, sources, or URLs.

          The HTML page must contain these sections:

          - Investigation title
          - The central claim
          - Why this matters
          - Background
          - What the evidence confirms
          - Evidence supporting the claim
          - Evidence challenging the claim
          - What remains unknown
          - Blind Truth analysis
          - Verdict
          - Sources
          - Draft review notice

          Use a clean dark black/red visual design consistent with
          an investigative publication.

          In the Draft Review Notice clearly state:

          "DRAFT — This investigation was AI-assisted and has not yet been
          approved for publication by The Blind Truth."

          Return only the complete HTML document.
          """

          search_tool = types.Tool(
              google_search=types.GoogleSearch()
          )

          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents=prompt,
              config=types.GenerateContentConfig(
                  tools=[search_tool]
              ),
          )

          html = response.text.strip()

          if not html:
              raise SystemExit("Gemini returned an empty response.")

          if "DRAFT" not in html.upper():
              raise SystemExit("Generated investigation is missing draft notice.")

          if not html.lower().lstrip().startswith("<!doctype html"):
              raise SystemExit("Gemini did not return a complete HTML document.")

          slug = topic.lower()
          slug = re.sub(r"[^a-z0-9]+", "-", slug)
          slug = slug.strip("-")[:70]

          if not slug:
              slug = "blind-truth-investigation"

          drafts_dir = Path("drafts")
          drafts_dir.mkdir(exist_ok=True)

          output = drafts_dir / f"{slug}.html"

          if output.exists():
              raise SystemExit(
                  f"Draft already exists: {output}"
              )

          output.write_text(html, encoding="utf-8")

          print(f"Created draft: {output}")
          PY

      - name: Commit draft investigation
        shell: bash
        run: |
          git add drafts/

          if git diff --cached --quiet; then
            echo "No draft was created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Create Blind Truth investigation draft"
          git push
