name: Blind Truth Weekly Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Publish scheduled investigations
        shell: bash
        run: |
          shopt -s nullglob
          files=(scheduled/*.html)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No scheduled investigations found."
            exit 0
          fi

          echo "Publishing scheduled investigations..."

          for file in "${files[@]}"; do
            filename=$(basename "$file")
            echo "Publishing $filename"
            mv "$file" "./$filename"
          done

      - name: Commit published investigations
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Publish scheduled Blind Truth investigation"
          git push
