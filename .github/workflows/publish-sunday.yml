name: Blind Truth Sunday Publisher

on:
  workflow_dispatch:
  schedule:
    # 11:00 AM Washington, D.C. time every Sunday.
    # GitHub evaluates cron in UTC, so DST is handled below.
    - cron: "0 15 * * 0"
    - cron: "0 16 * * 0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check Washington DC time
        id: dc_time
        shell: bash
        run: |
          DC_DAY=$(TZ=America/New_York date +%u)
          DC_HOUR=$(TZ=America/New_York date +%H)

          echo "Washington DC day: $DC_DAY"
          echo "Washington DC hour: $DC_HOUR"

          if [ "$DC_DAY" = "7" ] && [ "$DC_HOUR" = "11" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish scheduled investigations
        if: steps.dc_time.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          shopt -s nullglob
          files=(scheduled/*.html)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No scheduled investigations found."
            exit 0
          fi

          echo "Publishing scheduled Blind Truth investigations..."

          for file in "${files[@]}"; do
            filename=$(basename "$file")

            if [ -e "./$filename" ]; then
              echo "ERROR: ./$filename already exists."
              echo "Refusing to overwrite an existing published investigation."
              exit 1
            fi

            echo "Publishing $filename"
            mv "$file" "./$filename"
          done

      - name: Commit published investigations
        if: steps.dc_time.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Publish scheduled Blind Truth investigations"
          git push
